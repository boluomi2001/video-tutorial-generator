# 微信视频解析流水线 — 配置模板
# 复制本文件为 config.yaml 并填入你的真实配置

# === Whisper 语音转文字 ===
whisper:
  model_size: "medium"        # 短视频首选模型（高精度），可选 small/medium/large-v3
  fallback_model: "small"     # 长视频自动降级的快速模型
  max_duration_s: 300         # 超过 N 秒自动切换 fallback 模型
  device: "cpu"               # 无 GPU 用 cpu，有 NVIDIA GPU 可改 cuda
  compute_type: "int8"        # CPU 用量化 int8，GPU 可用 int8_float16
  language: "zh"

# === 视觉分析大模型 ===
llm:
  api_key: "sk-你的硅基流动APIKey"   # ← 必填，替换为你的 Key
  base_url: "https://api.siliconflow.cn/v1"
  # 视觉理解 / 教程生成：MoE 架构（激活 3B），4 图批次 13-19s，稳定不超时
  model: "Qwen/Qwen3-VL-30B-A3B-Instruct"
  # 分类 / 速览 / 清单 / 自检等纯文本轻量任务，约 0.5s
  fast_model: "Qwen/Qwen2.5-7B-Instruct"
  # 备选模型：
  #   Qwen/Qwen3-VL-8B-Instruct      5-9s，内容偏简，省钱可用
  #   Qwen/Qwen3-VL-32B-Instruct     73-120s，精度略高但常超时

# === 小红书（可选，一般不用配）===
# 实测结论（2026-10-15）：只要链接里带 xsec_token（App 里「分享 → 复制链接」
# 得到的就是），**匿名就能解析笔记详情**，不需要登录、不需要 Cookie。
# 只有这些情况才需要下面这项：
#   · 私密笔记 / 仅关注可见
#   · 链接的 xsec_token 已失效，且无法重新分享
# 配置方式二选一（环境变量优先）：
#   1) 这里填浏览器登录后的 Cookie 整串
#   2) 环境变量 XHS_COOKIE="web_session=..."
# 或直接跑 scripts/login_xhs.py 扫码登录，它会自动写入本项。
xhs:
  cookie: ""

# === ima 知识库（可选）===
# 流水线会把「待上传清单」写出来，方便把你的笔记同步进 ima 知识库。
# 这两项属于**使用者个人**信息，默认留空（留空时上传功能会跳过，不影响出笔记）。
# 知识库 ID：ima 客户端里打开知识库，从链接里取。
# 也可用环境变量 IMA_KB_ID / IMA_FOLDER_ID 覆盖（优先级更高）。
ima:
  knowledge_base_id: ""
  folder_id: ""

# === 飞书文档 / 知识库（可选）===
# 粘贴飞书文档或知识库链接（feishu.cn / larksuite.com 的 /wiki/ 或 /docx/）时，
# 自动走「飞书通道」。两种去向，按需选：
#
#   dest: wiki（默认）  复刻到**你自己的**飞书知识库
#       · 原理：飞书文档 XML 里的图片/视频是 token，而 `<img src="token"/>`、
#         `<source token="..."/>` 支持**跨文档复用** → CLI 会把媒体重新上传到新文档。
#       · 实测保真：15 个媒体全量迁移、6 段 mp4 字节数逐一一致、表格/引用/高亮块结构不变。
#       · 好处：文档内嵌的视频也能搬过去，绕开「ima 不支持视频附件」的问题。
#   dest: md           本地归档 md（素材下载到 assets/），产出「待上传清单」给 ima
#
# ⚠️ 不是开箱即用：需要本机有 `lark-cli`（WorkBuddy 飞书连接器自带），
#    并且先扫码授权一次 —— `lark-cli auth login --as user`
#    没有它的话，飞书链接会直接报错并给出指引。
# ⚠️ 只能读写**你自己账号有权限**的文档：别人单篇分享给你的可以读、可以复刻；
#    未分享给你的公开链接读不到。想搬**别人整个知识库**，需要对方把你加为成员
#    （否则 copy 接口报 131006 —— 本通道走 XML 重建，不受此限）。
# ⚠️ 不搬迁：评论、历史版本、权限设置、封面；也不会递归搬运子节点/目录树。
lark:
  dest: "wiki"          # wiki=复刻到自己飞书知识库（推荐）｜md=本地归档给 ima
  target: "my_library"  # 复刻落点：my_library=个人文档库；也可写知识库节点 token
  parent_node_token: "" # 可选：指定父节点 token（在该节点下建子文档）

# === 关键帧提取 ===
frames:
  threshold: 30.0              # 场景变化检测阈值，越大提取帧越少
  max_frames: 20               # 最多提取的帧数

# === OCR ===
ocr:
  confidence_threshold: 0.5    # 文字识别置信度阈值

# === 内容分类 ===
